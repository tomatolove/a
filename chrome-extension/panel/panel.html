<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Capture2PDF 実行中</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>Capture2PDF</h1>
  <p id="statusText" class="status-text">準備中...</p>
  <div class="progress-outer"><div id="progressBar" class="progress-inner"></div></div>
  <p id="countText" class="count-text">0 / 0</p>

  <button type="button" id="finalizeBtn" class="primary" hidden>編集画面へ進む</button>

  <div class="controls">
    <button type="button" id="pauseBtn">一時停止</button>
    <button type="button" id="stopBtn">ここまでで終了</button>
    <button type="button" id="cancelBtn" class="danger">キャンセル</button>
  </div>

  <div id="errorBox" class="error-box" hidden>
    <p id="errorText"></p>
    <p class="error-hint" id="errorHint">ページを確認してください。読み込み直す必要があれば下のボタンで再読み込み
      できます。準備ができたら「再開」で同じ位置から撮り直します。おかしなタイルがあれば、その
      サムネイルの「ここから撮り直す」でそこから先を撮り直せます。</p>
    <button type="button" id="reloadBtn">ページを再読み込み</button>
  </div>

  <h2 id="tileListHeading">キャプチャ済みタイル</h2>
  <div id="tileList" class="tile-list"></div>
</body>
<script src="panel.js"></script>
</html>
